# Bloque server para /mnt/disco1/sicalab/nginx/nginx.conf
# App simple (un servicio). Nginx corre en el HOST; proxy_pass al container_name vía $upstream.
server {
    listen 80;
    server_name recategorizacion-jornales.sica;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream sicalab-recategorizacion-jornales-1:3000;

    location / {
        proxy_pass         http://$upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
