# Bloque server para /mnt/disco1/sicalab/nginx/nginx.conf
# App simple (un servicio). Nginx corre en el HOST: proxy_pass a la IP del servidor + puerto publicado.
# Reemplazar PUERTO por el puerto libre elegido en el docker-compose central (ports: "PUERTO:3000").
server {
    listen 80;
    server_name recategorizacion-jornales.sica;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream 192.168.0.195:PUERTO;

    location / {
        proxy_pass         http://$upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # defensa en profundidad: nunca dejar pasar este header interno de Next desde el cliente
        proxy_set_header   X-Middleware-Subrequest "";
        proxy_http_version 1.1;
    }
}
